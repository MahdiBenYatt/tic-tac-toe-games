   <!-- /* ________________________________Game html ------______________________ */ -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME : TIC TAC TOE</title>
    <link rel="stylesheet" href="Project_GAME_Css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div id="overly">   !
    <div id="message">
        <!-- Especially To Close  -->
        <div id="close">
            <i class="fa fa-close"></i>
        </div>
        <div class="content"> <b>X is the <h1>winner</h1></b></div>
    </div>
</div>

<div class="container">
    <div class="tools">
        <div class="symbols">
            <i class="fa fa-close"></i>
            <p>  Or  </p>
            <i class="fa fa-circle-o"></i>
            
        </div>
        <div class="turn">
            <!-- // write X or O  -->
            <span class="current-turn"></span> Turn
        </div>
        <div class="reset">
            <div class="button">
                <i class="fa fa-rotate-right"></i>
            </div>
        </div>
    </div>
    <div class="board">
        <!-- // cells : الخلايا  -->
        <div class="cells">        
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="cells">        
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="cells">        
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
    </div>
    <!-- // stats : احصائيات  -->
    <div class="stats">
        <div class="plyer">
            <label ><i class="fa fa-close"></i> : Plyer One  </i></label>
            <span class="result_one">0</span>
        </div>

        <div class="draws">
            <label >Draw</label>
            <span class="draw">0</span>
        </div>

        <div class="plyer">
            <label ><i class="fa fa-circle-o"></i> : Plyer Tow </label>
            <span class="result_tow">0</span>
        </div>
    </div>
</div> 

<script src="Project_GAME_JS.js"></script>
</body>
</html>
